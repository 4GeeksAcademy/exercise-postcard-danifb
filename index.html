<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Postcard</title>
    <link rel="stylesheet" href="styles.css">
    <style>
    </style>
</head>
<body>
    <div class="postcard">
        <h1>My Postcard</h1>

        <div class="postcard-image">
            <a href="https://storage.googleapis.com/breathecode-asset-images/5318bde604cf5c915f94897a71b49ab2523101322ea21cb046db1e67c24fa3be.png" target="_blank">
                <img src="https://storage.googleapis.com/breathecode-asset-images/5318bde604cf5c915f94897a71b49ab2523101322ea21cb046db1e67c24fa3be.png" alt="Scenic postcard featuring a beautiful landscape with mountains and a serene lake under a clear blue sky, conveying a sense of peace and natural wonder">
            </a>
        </div>

        <div class="message">
            <p>Look how awesome! This postcard that I created using HTML5 and CSS3 during my 4Geeks Academy Course!</p>
            <p>This is so cool, I can't wait to start doing more stuff!</p>
            <div class="contact">
                <input type="text" placeholder="Your Name">
                <input type="email" placeholder="Your Email">
                <input type="text" placeholder="Your Address">
            </div>
        </div>

        <div class="actions">
            <button class="button">Send My Postcard</button>
        </div>
    </div>
</body>
</html>
